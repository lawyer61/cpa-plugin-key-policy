# Example CLIProxyAPI snippet for cpa-key-policy.
# Replace placeholders. Do not commit real secrets or production hosts.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-key-policy:
      enabled: true
      priority: 10
      # Runtime source of truth once created (keys, aliases, classify rules, usage).
      state_file: "cpa-key-policy-state.json"
      # Unbound plugin keys may ignore group in this compatibility mode.
      # Explicit account_binding constraints always win over this setting.
      global_weighted_round_robin: false
      # Process-local session affinity defaults. Old keys remain opt-out.
      session_affinity_idle_ttl_seconds: 3600
      session_affinity_max_entries: 10000
      # Exact CPA auth candidate IDs only. Missing/zero means unlimited.
      auth_concurrency_limits:
        "codex-team-a.json": 4
      # Passive quota evidence is primary. Background GET only reviews missing,
      # stale, reset-crossed, or activation-verification state.
      quota_check_interval: "30m"
      quota_cache_ttl: "30m"
      # Safe default: no compact activation requests until explicitly enabled.
      quota_activation_enabled: false
      quota_activation_scope: "managed-pools" # managed-pools | all-codex

      # Prefer creating keys/aliases/classify rules via Web UI or Management API.
      # Seed keys below are mainly for first boot when state_file does not exist.
      keys:
        - id: "team-a"
          name: "Team A"
          enabled: true
          key_hash: "sha256:replace-with-hash"
          key_preview: "cpa_abc...xyz"
          rpm: 60
          max_concurrent_requests: 4 # 0 = unlimited
          session_affinity: true
          # Optional fail-closed account isolation. Globs match the exact CPA
          # auth candidate ID. A present empty allow list denies every account.
          account_binding:
            allow:
              - "codex-team-*.json"
            strategy: "quota-fill-first" # weighted-round-robin | round-robin | fill-first | quota-fill-first
          # Either bind models directly…
          models:
            - alias: "fast"
              provider: "codex"
              target_model: "gpt-5.4-mini"
              group: "free" # built-in tier; custom groups use classify:name
            - alias: "compat-demo"
              provider: "cerebras" # openai-compatibility channel name
              target_model: "gpt-oss-120b"
          # …or reference global aliases created in the UI / POST /aliases:
          # aliases:
          #   - alias: "cheap-chat"
